name: ci

# The tests build a real workspace and run nx and rkp in it, once per Nx version in matrix.json.
# rkp is built from rathkit/pack at the ref below (the tests read it from RATHKIT_PACK_BIN, with no fallback).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PACK_REF: main

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "ubuntu-24.04 node 24 nx 24", os: ubuntu-24.04, node: 24, nx: "24.0.6" }
          - { name: "ubuntu-24.04 node 24 nx 23", os: ubuntu-24.04, node: 24, nx: "23.3.2" }
          - { name: "ubuntu-24.04 node 26 nx 24", os: ubuntu-24.04, node: 26, nx: "24.0.6" }
          - { name: "ubuntu-24.04 node 26 nx 23", os: ubuntu-24.04, node: 26, nx: "23.3.2" }
          - { name: "ubuntu-26.04 node 24 nx 24", os: ubuntu-26.04, node: 24, nx: "24.0.6" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rathkit/pack
          ref: ${{ env.PACK_REF }}
          path: pack
          persist-credentials: false
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4
        with:
          runtime: node@${{ matrix.node }}
          cache: true
          require-lockfile: true
      - run: |
          for attempt in 1 2 3; do
            rustup toolchain install stable --profile minimal && break
            [ "$attempt" = 3 ] && exit 1
            sleep 20
          done
          rustup default stable
      - run: cargo build --release
        working-directory: pack
      - run: node tools/check-zero-deps.mjs
      - name: Tests
        run: pnpm test
        env:
          RATHKIT_PACK_BIN: ${{ github.workspace }}/pack/target/release/rkp
          RATHKIT_PACK_SPEC: file:${{ github.workspace }}/pack/npm/pack
          RATHKIT_NX_VERSION: ${{ matrix.nx }}
