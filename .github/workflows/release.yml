# Packs, checks and publishes the plugin when a version tag is pushed: one tarball, SHA256SUMS, and a GitHub release (a pre-release while
# the version has a suffix such as -beta.0). By hand it is a dry run: the tarball is made and kept as a workflow artifact, and nothing is
# released or published. The package goes to npm only when the repository variable NPM_PUBLISH is "true", which the owner sets after the
# trusted publisher is configured on npm. No npm token is stored anywhere: publishing uses trusted publishing (OIDC), and the version
# waits in npm until the owner approves it with two-factor authentication.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to pack as a dry run, for example v0.1.0-beta.0 (nothing is released or published)"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4
        with:
          runtime: node@24
          require-lockfile: true
      - name: The tag is the version in package.json
        run: test "v$(node -p "require('./package.json').version")" = "$TAG"
      - run: node tools/check-zero-deps.mjs
      - name: Pack, and check what is inside
        run: |
          mkdir dist
          pnpm pack --pack-destination dist
          file=$(ls dist/*.tgz)
          for must in package/NOTICE package/LICENSE package/plugin.js package/executors.json package/generators.json; do
            tar -tzf "$file" | grep -qx "$must" || { echo "$must is not in $file"; exit 1; }
          done
          (cd dist && sha256sum *.tgz > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error

  release:
    needs: pack
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flag=""
          case "$TAG" in *-*) flag="--prerelease" ;; esac
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes $flag

  npm:
    needs: release
    if: github.event_name == 'push' && vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write # trusted publishing and the provenance statement
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          registry-url: https://registry.npmjs.org
      - name: Take the package from the release and check it against SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir packed
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.tgz' --pattern SHA256SUMS --dir packed
          cd packed
          test "$(ls *.tgz | wc -l)" = 1
          grep '\.tgz$' SHA256SUMS | sha256sum --check --strict
      - name: Stage with provenance (a version with a suffix goes to the next tag, never latest)
        run: |
          tag=latest
          case "$TAG" in *-*) tag=next ;; esac
          npm stage publish ./packed/rathkit-nx-plugin-${TAG#v}.tgz --access public --tag "$tag" --provenance
